<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shmup flight test</title>
  <style>
    body { margin: 0; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); background: black; color: #b9d6de; }
    header { padding: 6px 10px; font: 12px/1.35 monospace; }
    #sound { float: right; width: 8em; min-height: 32px; font: inherit; background: #102128; color: inherit; border: 1px solid #506970; }
    #build { white-space: pre-line; }
    #flight { min-height: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <header><button id="sound" type="button" aria-pressed="false">Sound off</button><div id="controller">Press a controller button</div><div id="build"></div></header>
  <main id="flight"></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
